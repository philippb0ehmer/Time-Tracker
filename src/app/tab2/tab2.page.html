<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Projects
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createProject()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Projects</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Active Projects -->
  <div class="projects-container">
    <div *ngIf="projects.length === 0" class="empty-state">
      <ion-icon name="folder-open-outline" size="large"></ion-icon>
      <h2>No Projects Yet</h2>
      <p>Create your first project to start tracking time</p>
      <ion-button (click)="createProject()">
        <ion-icon slot="start" name="add"></ion-icon>
        Create Project
      </ion-button>
    </div>

    <ion-list *ngIf="projects.length > 0">
      <ion-item-sliding *ngFor="let project of projects">
        <ion-item>
          <ion-icon
            slot="start"
            name="ellipse"
            [style.color]="project.color"
            size="large">
          </ion-icon>
          <ion-label>
            <h2>{{ project.name }}</h2>
            <p>Created {{ project.createdAt | date:'short' }}</p>
          </ion-label>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option color="primary" (click)="editProject(project)">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-item-option>
          <ion-item-option color="warning" (click)="archiveProject(project)">
            <ion-icon slot="icon-only" name="archive"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="deleteProject(project)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>

    <!-- Archived Projects Section -->
    <div *ngIf="archivedProjects.length > 0" class="archived-section">
      <ion-item button (click)="toggleArchived()" detail="false">
        <ion-icon
          slot="start"
          [name]="showArchived ? 'chevron-down' : 'chevron-forward'">
        </ion-icon>
        <ion-label>
          <h3>Archived Projects ({{ archivedProjects.length }})</h3>
        </ion-label>
      </ion-item>

      <ion-list *ngIf="showArchived">
        <ion-item-sliding *ngFor="let project of archivedProjects">
          <ion-item>
            <ion-icon
              slot="start"
              name="ellipse"
              [style.color]="project.color"
              [style.opacity]="0.5"
              size="large">
            </ion-icon>
            <ion-label>
              <h2>{{ project.name }}</h2>
              <p><em>Archived</em></p>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="success" (click)="unarchiveProject(project)">
              <ion-icon slot="icon-only" name="arrow-undo"></ion-icon>
            </ion-item-option>
            <ion-item-option color="danger" (click)="deleteProject(project)">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </div>
  </div>

  <!-- Floating Action Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createProject()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
